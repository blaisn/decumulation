name: CI

# Vérifie chaque pull request et chaque poussée sur main : types, tests et construction.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Une nouvelle poussée sur la même branche annule la vérification en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vérifications (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # Les types d'Electron suffisent pour vérifier le code : inutile de télécharger son binaire.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Le cache npm demande un package-lock.json : sans lui, on s'en passe.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Installer les dépendances
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Vérifier les types
        run: npm run typecheck

      - name: Lancer les tests
        run: npm test

      - name: Construire l'application
        run: npm run build
