<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; worker-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Décumulation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><h1>Plan de décaissement</h1><p>Couple de retraités au Québec</p></div>
    <div class="actions"><button type="button" id="open" class="ghost">Ouvrir un scénario</button><button type="button" id="save" class="ghost">Enregistrer</button></div>
  </header>
  <main class="split">
    <aside id="inputs" class="inputs" aria-label="Données du couple"><div id="basebar" class="basebar" aria-live="polite"></div><div id="formbody"></div></aside>
    <section class="results" aria-label="Résultats">
      <div class="tabbar">
        <div class="lead">
          <button type="button" id="toggle-form" class="toggle" aria-controls="inputs" aria-expanded="true">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor" stroke-width="1.4"/></svg>
            <span class="lbl">Masquer le formulaire</span>
          </button>
          <div id="tabs" class="tabs" role="tablist" aria-label="Sections des résultats"></div>
        </div>
        <div id="units" class="units" role="radiogroup" aria-labelledby="units-l"></div>
      </div>
      <div id="panel" class="panel" role="tabpanel"></div>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
